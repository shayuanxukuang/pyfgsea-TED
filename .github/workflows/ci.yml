name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["ted-v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_NET_RETRY: 10
  CARGO_HTTP_TIMEOUT: 60

jobs:
  installed-package-compatibility:
    name: installed package (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and install wheel
        run: |
          python -m pip install --upgrade pip maturin
          maturin build --release --out dist
          python -m pip install dist/*.whl
          python -m pip check
      - name: Exercise installed package outside the source tree
        run: |
          mkdir -p /tmp/ted-installed-smoke
          cd /tmp/ted-installed-smoke
          python -I -c "import pyfgsea; print(pyfgsea.__version__)"
          ted --version
          ted run --help
          python -I "$GITHUB_WORKSPACE/scripts/run_ted_validation_demo.py" --outdir demo
          ted validate demo/demo_activity.tsv --kind activity --report demo/activity_validation.tsv
          ted validate demo/demo_events_v2.tsv --kind event --schema-version v2 --report demo/event_validation.tsv
      - name: Upload compatibility evidence
        uses: actions/upload-artifact@v4
        with:
          name: ted-python-${{ matrix.python-version }}-smoke
          path: /tmp/ted-installed-smoke/demo/**

  locked-reproduction-environment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the canonical locked environment
        run: |
          python -m pip install --upgrade pip uv
          uv pip sync --system requirements-reproduction-py311.txt
          maturin build --release --out dist
          python -m pip install --no-deps dist/*.whl
          python -m pip check
      - name: Run the locked schema smoke
        run: |
          mkdir -p /tmp/ted-locked-smoke
          cd /tmp/ted-locked-smoke
          python -I "$GITHUB_WORKSPACE/scripts/run_ted_validation_demo.py" --outdir demo
          ted validate demo/demo_activity.tsv --kind activity --report demo/activity_validation.tsv
          ted validate demo/demo_events_v2.tsv --kind event --schema-version v2 --report demo/event_validation.tsv

  fast-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and install wheel
        run: |
          python -m pip install --upgrade pip maturin pytest
          maturin build --release --out dist
          python -m pip install dist/*.whl
      - name: Run fast test suite
        run: |
          mkdir -p /tmp/ted-test-support
          cp -r scripts /tmp/ted-test-support/
          cd /tmp
          set -o pipefail
          PYTHONPATH=/tmp/ted-test-support python -m pytest "$GITHUB_WORKSPACE/tests" -q \
            -m "not slow and not external and not external_data" \
            --import-mode=importlib \
            --junitxml="$GITHUB_WORKSPACE/ted-fast-tests-junit.xml" \
            | tee "$GITHUB_WORKSPACE/ted-fast-test-summary.txt"
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: ted-linux-wheel
          path: dist/*.whl
      - name: Upload test evidence
        uses: actions/upload-artifact@v4
        with:
          name: ted-fast-test-evidence
          path: |
            ted-fast-tests-junit.xml
            ted-fast-test-summary.txt

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install package
        run: python -m pip install . pytest
      - name: Run integration and schema tests
        run: |
          mkdir -p /tmp/ted-test-support
          cp -r scripts /tmp/ted-test-support/
          cd /tmp
          PYTHONPATH=/tmp/ted-test-support python -m pytest -q --import-mode=importlib \
            "$GITHUB_WORKSPACE/tests/test_ted_schema.py" \
            "$GITHUB_WORKSPACE/tests/test_ted_evidence.py" \
            "$GITHUB_WORKSPACE/tests/test_ted_perturbation.py" \
            "$GITHUB_WORKSPACE/tests/test_ted_known_source_validation.py"

  bib-companion-contract:
    name: BIB companion contract (focused 81)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and install the candidate package
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest
          python -m pip check
      - name: Run the exact focused 81-test contract
        run: |
          cd /tmp
          python -I "$GITHUB_WORKSPACE/scripts/run_ted_bib_focused_tests.py" \
            --repository "$GITHUB_WORKSPACE" \
            --analysis-lock-commit "$GITHUB_SHA" \
            --output-dir "$GITHUB_WORKSPACE/results/ted_bib_focused_81"
      - name: Run the seven v1.1 schema extensions
        run: |
          cd /tmp
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
          PYTHONPATH="$GITHUB_WORKSPACE/scripts" \
          python -m pytest -q \
            "$GITHUB_WORKSPACE/tests/test_ted_evidence.py::test_parallel_evidence_types_never_upgrade_event_e_code" \
            "$GITHUB_WORKSPACE/tests/test_ted_schema.py::test_canonical_parallel_evidence_schema_matches_embedded_v2_contract" \
            "$GITHUB_WORKSPACE/tests/test_ted_schema.py::test_canonical_parallel_evidence_schema_enforces_controls_and_replication_id" \
            "$GITHUB_WORKSPACE/tests/test_ted_schema.py::test_canonical_replication_facets_schema_matches_embedded_v2_contract" \
            "$GITHUB_WORKSPACE/tests/test_ted_schema.py::test_canonical_replication_facets_keep_event_and_outcome_results_separate"
      - name: Exercise the fail-closed companion packager
        run: |
          cd /tmp
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
          PYTHONPATH="$GITHUB_WORKSPACE/scripts:$GITHUB_WORKSPACE/reproduce" \
          python -m pytest -q \
            "$GITHUB_WORKSPACE/tests/test_bib_companion_packager.py"
      - name: Upload focused test evidence
        uses: actions/upload-artifact@v4
        with:
          name: ted-v1.1.0-focused-81-evidence
          path: results/ted_bib_focused_81/**
          if-no-files-found: error

  slow-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install package
        run: python -m pip install . pytest
      - name: Run marked slow tests
        run: |
          mkdir -p /tmp/ted-test-support
          cp -r scripts /tmp/ted-test-support/
          cd /tmp
          PYTHONPATH=/tmp/ted-test-support python -m pytest "$GITHUB_WORKSPACE/tests" -q -m slow --import-mode=importlib

  validation-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install package
        run: python -m pip install .
      - name: Run validation demo
        run: |
          python -I scripts/run_ted_validation_demo.py --outdir ci_ted_demo
          ted validate ci_ted_demo/demo_activity.tsv --kind activity --report ci_ted_demo/activity_validation.tsv
          ted validate ci_ted_demo/demo_events_v2.tsv --kind event --schema-version v2 --report ci_ted_demo/event_validation.tsv
      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: ted-validation-demo
          path: ci_ted_demo/**

  docker-smoke:
    if: startsWith(github.ref, 'refs/tags/ted-v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build main image without cache
        run: docker build --no-cache -t ted:ci .
      - name: Smoke-test main image
        run: |
          docker run --rm ted:ci
          docker run --rm ted:ci ted --version
          docker run --rm ted:ci python -I scripts/run_ted_validation_demo.py --outdir /tmp/ted_demo
      - name: Build baseline image without cache
        run: docker build --no-cache -f Dockerfile.baselines -t ted-baselines:ci .
      - name: Smoke-test baseline image
        run: docker run --rm ted-baselines:ci

  exact-tag-release-attestation:
    if: github.ref == 'refs/tags/ted-v1.0.1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build Git-object-backed release manifests
        run: |
          python scripts/build_release_manifests.py \
            --baseline-ref ted-v1.0.0 \
            --release-ref "$GITHUB_SHA" \
            --external-assets-template release/ted-v1.0.1/EXTERNAL_ARCHIVE_ASSETS.template.tsv \
            --outdir release-attestation
      - name: Upload release attestation
        uses: actions/upload-artifact@v4
        with:
          name: ted-v1.0.1-release-attestation
          path: release-attestation/**
